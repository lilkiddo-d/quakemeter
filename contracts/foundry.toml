[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = true
fs_permissions = [
  { access = "read", path = "../config" },
  { access = "read", path = "./test/fixtures" },
  { access = "read-write", path = "../deployments" },
  { access = "read-write", path = "../app/src/config/generated" },
]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@prb/math/=lib/prb-math/src/",
  "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 60
fail_on_revert = false

[profile.ci.fuzz]
runs = 1000

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
anvil = "http://127.0.0.1:8545"

# Robinhood Chain uses Blockscout; verification is done with --verifier blockscout (see DEPLOY.md)

[fmt]
line_length = 110

[lint]
lint_on_build = false
